
services:
  mysql-user:
    image: mysql:8.0
    container_name: movievault-mysql-user
    restart: unless-stopped
    command: ["--server-id=101"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_user_data:/var/lib/mysql

  mysql-watchlist:
    image: mysql:8.0
    container_name: movievault-mysql-watchlist
    restart: unless-stopped
    command: ["--server-id=201"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: watchlist_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_watchlist_data:/var/lib/mysql

  mysql-user-replica:
    image: mysql:8.0
    container_name: movievault-mysql-user-replica
    restart: unless-stopped
    command: ["--server-id=102", "--read-only=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - mysql_user_replica_data:/var/lib/mysql
    depends_on:
      - mysql-user

  mysql-watchlist-replica:
    image: mysql:8.0
    container_name: movievault-mysql-watchlist-replica
    restart: unless-stopped
    command: ["--server-id=202", "--read-only=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - mysql_watchlist_replica_data:/var/lib/mysql
    depends_on:
      - mysql-watchlist

  mongo1:
    image: mongo:8.0
    container_name: movievault-mongo1
    command: ["mongod", "--shardsvr", "--replSet", "rs0", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27025:27017"
    volumes:
      - mongo1_data:/data/db


  mongo2:
    image: mongo:8.0
    container_name: movievault-mongo2
    command: ["mongod", "--shardsvr", "--replSet", "rs0", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:8.0
    container_name: movievault-mongo3
    command: ["mongod", "--shardsvr", "--replSet", "rs0", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db

  mongo4:
    image: mongo:8.0
    container_name: movievault-mongo4
    command: ["mongod", "--shardsvr", "--replSet", "rs1", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27022:27017"
    volumes:
      - mongo4_data:/data/db

  mongo5:
    image: mongo:8.0
    container_name: movievault-mongo5
    command: ["mongod", "--shardsvr", "--replSet", "rs1", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27023:27017"
    volumes:
      - mongo5_data:/data/db

  mongo6:
    image: mongo:8.0
    container_name: movievault-mongo6
    command: ["mongod", "--shardsvr", "--replSet", "rs1", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27024:27017"
    volumes:
      - mongo6_data:/data/db


  cassandra1:
    image: cassandra:5.0
    container_name: movievault-cassandra1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: MovieVaultCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra1_data:/var/lib/cassandra

  cassandra2:
    image: cassandra:5.0
    container_name: movievault-cassandra2
    environment:
      CASSANDRA_CLUSTER_NAME: MovieVaultCluster
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra2_data:/var/lib/cassandra

  cassandra3:
    image: cassandra:5.0
    container_name: movievault-cassandra3
    environment:
      CASSANDRA_CLUSTER_NAME: MovieVaultCluster
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra3_data:/var/lib/cassandra


  redis-primary:
    image: redis:7.4
    container_name: movievault-redis-primary
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_primary_data:/data

  redis-replica:
    image: redis:7.4
    container_name: movievault-redis-replica
    command: ["redis-server", "--replicaof", "redis-primary", "6379", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    depends_on:
      - redis-primary
    volumes:
      - redis_replica_data:/data

  redis-sentinel1:
    image: redis:7.4
    container_name: movievault-redis-sentinel1
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
      redis-server /tmp/sentinel.conf --sentinel"
    ports:
      - "26379:26379"
    volumes:
      - ./database/redis/sentinel1.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-primary
      - redis-replica

  redis-sentinel2:
    image: redis:7.4
    container_name: movievault-redis-sentinel2
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
      redis-server /tmp/sentinel.conf --sentinel"
    ports:
      - "26380:26379"
    volumes:
      - ./database/redis/sentinel2.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-primary
      - redis-replica

  redis-sentinel3:
    image: redis:7.4
    container_name: movievault-redis-sentinel3
    command: >
      sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
      redis-server /tmp/sentinel.conf --sentinel"
    ports:
      - "26381:26379"
    volumes:
      - ./database/redis/sentinel3.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis-primary
      - redis-replica

  configsvr1:
    image: mongo:8.0
    container_name: movievault-config1
    command: ["mongod", "--config", "/etc/mongo/configsvr.conf"]
    volumes:
      - config1_data:/data/db
      - ./mongo-config/configsvr.conf:/etc/mongo/configsvr.conf:ro
    networks:
      - default

  configsvr2:
    image: mongo:8.0
    container_name: movievault-config2
    command: ["mongod", "--config", "/etc/mongo/configsvr.conf"]
    volumes:
      - config2_data:/data/db
      - ./mongo-config/configsvr.conf:/etc/mongo/configsvr.conf:ro
    networks:
      - default

  configsvr3:
    image: mongo:8.0
    container_name: movievault-config3
    command: ["mongod", "--config", "/etc/mongo/configsvr.conf"]
    volumes:
      - config3_data:/data/db
      - ./mongo-config/configsvr.conf:/etc/mongo/configsvr.conf:ro
    networks:
      - default

  mongos:
    image: mongo:8.0
    container_name: movievault-mongos
    command:
      - mongos
      - --configdb
      - configRS/configsvr1:27019,configsvr2:27019,configsvr3:27019
      - --bind_ip_all
      - --port
      - "27017"
    ports:
      - "27021:27017"
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3
    networks:
      - default


volumes:
  mysql_user_data:
  mysql_watchlist_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  mongo4_data:
  mongo5_data:
  mongo6_data:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:
  redis_primary_data:
  redis_replica_data:
  config1_data:
  config2_data:
  config3_data:
  mysql_user_replica_data:
  mysql_watchlist_replica_data:
